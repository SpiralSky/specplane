name: Specplane publish
# Runs only when a version tag such as v0.1.0 is pushed.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install and test
        working-directory: packages/cli
        run: |
          npm ci
          npm test

      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public   # prepack builds dist/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
