name: Specplane validate
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git branch checks; pin checks compare blob hashes and work with a shallow clone (a missing pinned object only omits the diff hint)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Specplane from this checkout
        # This repository builds its own CLI: the npm package is not published yet.
        working-directory: packages/cli
        run: |
          npm ci
          npm run build
          npm install -g .

      - name: Validate
        run: specplane validate

      - name: Check documentation for personal paths
        run: python3 scripts/check-personal-paths.py
