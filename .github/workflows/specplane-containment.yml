name: Specplane portable containment
on:
  push:
    paths:
      - "packages/cli/**"
      - ".github/workflows/specplane-containment.yml"
  pull_request:
    paths:
      - "packages/cli/**"
      - ".github/workflows/specplane-containment.yml"

permissions:
  contents: read

jobs:
  containment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check portable file containment
        run: node --test dist/core/contained-files.test.js
